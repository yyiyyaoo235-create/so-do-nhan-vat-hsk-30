:root{
  --z:1;
  --bg:#FDF6F4; --panel:#FFFFFF; --ink:#20222A; --muted:#6B6F76;
  --red:#C8382F; --red-soft:#FBE7E4; --red-line:#E7B9B3;
  --blue:#1D6FA3; --green:#2A8468; --purple:#7B51BE; --pink:#D6336C; --amber:#E07B1A;
  --radius:16px;
  font-size: calc(17px * var(--z));
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Nunito',system-ui,-apple-system,"Segoe UI","Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;
  font-weight:600; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.zh{font-family:'Nunito',"Noto Sans SC","Microsoft YaHei","PingFang SC","Hiragino Sans GB","Source Han Sans SC","Noto Sans CJK SC",sans-serif;}

/* ---------- TOP BAR ---------- */
.topbar{
  position:sticky; top:0; z-index:40; background:#fff; border-bottom:2px solid var(--red-soft);
  padding:.65rem 1.2rem; display:flex; flex-wrap:wrap; gap:.8rem 1.3rem; align-items:center;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}
.brand{display:flex; align-items:baseline; gap:.6rem; margin-right:auto}
.brand b{font-size:1.3rem; color:var(--red); font-weight:800}
.brand span{font-size:.92rem; color:var(--muted); font-weight:700}
.tabs{display:flex; gap:.35rem; background:var(--red-soft); padding:.26rem; border-radius:999px}
.tab{border:0; cursor:pointer; font:inherit; font-weight:800; font-size:1rem;
  padding:.46rem 1.05rem; line-height:1.55; border-radius:999px; background:transparent; color:#9b5e58;}
.tab[aria-selected="true"]{background:var(--red); color:#fff; box-shadow:0 2px 6px rgba(200,56,47,.35)}
.tab[data-ready="false"]{opacity:.6}
.tools{display:flex; align-items:center; gap:.5rem; flex-wrap:wrap}
.btn{border:1.5px solid var(--red-line); background:#fff; color:var(--ink); cursor:pointer;
  font:inherit; font-size:.95rem; font-weight:700; padding:.36rem .75rem; border-radius:10px;}
.btn:hover{background:var(--red-soft)}
.zoomwrap{display:flex; align-items:center; gap:.3rem; border:1.5px solid var(--red-line); border-radius:10px; padding:.12rem .3rem; background:#fff}
.zoomwrap button{border:0;background:transparent;cursor:pointer;font:inherit;font-weight:900;font-size:1.1rem;padding:.08rem .5rem;color:var(--red)}
#zval{font-size:.9rem; font-weight:800; min-width:3.1rem; text-align:center; color:var(--muted)}
.switch{display:flex;align-items:center;gap:.4rem;font-size:.95rem;font-weight:700;cursor:pointer}
.switch input{width:1.05rem;height:1.05rem;accent-color:var(--red)}

/* ---------- HELP STRIP ---------- */
.helpbar{display:flex; flex-wrap:wrap; gap:.4rem 1.3rem; align-items:center;
  padding:.5rem 1.3rem; background:#fff; border-bottom:1px solid #F0E2DF; font-size:.9rem; color:var(--muted); font-weight:700;}
.helpbar .key{background:var(--red-soft); color:#9c3b34; font-weight:800; padding:.14rem .45rem; line-height:1.6; border-radius:6px; display:inline-block}
.legend{display:flex;flex-wrap:wrap;gap:.45rem 1rem;align-items:center;margin-left:auto}
.lg{display:flex;align-items:center;gap:.4rem;font-size:.88rem;font-weight:700;color:#4a4d53}
.lg i{display:block;width:1.9rem;height:0;border-top-width:3px;border-top-style:solid;border-radius:2px}

/* ---------- BOARD ---------- */
#board{position:relative; padding:1.5rem 2.2rem 4.6rem; min-height:60vh; overflow-x:auto}
#wires{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:5; overflow:visible}
#wires path.link{fill:none; stroke-linecap:round; stroke-linejoin:round}
#wires rect.pill{fill:#fff; stroke-width:1.5}
#wires text.wl{font-family:'Nunito',sans-serif; font-weight:800; font-size:.86rem; text-anchor:middle}
#wires text.wl tspan.v{font-size:.74rem; font-weight:700; fill:#5c6066}
#wires.nolabel .lbl{display:none}
#wires g{transition:opacity .15s}
#board.focusing #wires > g{opacity:.1}
#board.focusing #wires > g.on{opacity:1}

.scenes{position:relative; z-index:2; display:grid; grid-template-columns:auto auto; justify-content:center; gap:1.4rem 3.6rem; align-items:start}
.scene{background:var(--panel); border-radius:var(--radius); padding:1rem 1.2rem 1.6rem; box-shadow:0 2px 14px rgba(120,60,50,.07)}
.scene>h2{margin:0; font-size:1.1rem; display:flex; flex-wrap:wrap; align-items:baseline; gap:.5rem; font-weight:800}
.scene>h2 b{font-size:1.28rem; font-weight:800}
.scene>h2 span{font-weight:700; color:var(--muted); font-size:.95rem}
.scene-abroad{border-top:5px solid var(--blue)}
.scene-abroad>h2 b{color:var(--blue)}
.scene-china{border-top:5px solid var(--red)}
.scene-china>h2 b{color:var(--red)}

.col{display:flex; flex-direction:column; align-items:center; gap:3.4rem; margin-top:3rem}
.rowc{display:flex; justify-content:center; gap:1.1rem; flex-wrap:nowrap}
.china-grid{margin-top:3rem; display:grid; grid-template-columns:auto auto auto;
  justify-content:center; align-items:start; column-gap:3rem; row-gap:3.9rem}
.china-grid .g-yixue{grid-column:2; grid-row:1}
.china-grid .g-liuming{grid-column:3; grid-row:1}
.china-grid .g-tongle{grid-column:1; grid-row:2}
.china-grid .g-xiaoxue{grid-column:2; grid-row:2}
.china-grid .g-xiaoming{grid-column:3; grid-row:2}

.groupbox{border:2.5px dashed var(--blue); border-radius:18px; padding:1.5rem 1rem 1rem; position:relative; background:#F3F8FC;}
.groupbox>.gbtitle{position:absolute; top:-.8rem; left:50%; transform:translateX(-50%);
  background:var(--blue); color:#fff; font-weight:800; font-size:.88rem; padding:.3rem .85rem; line-height:1.5; border-radius:999px; white-space:nowrap;}

/* ---------- CARD ---------- */
.card{width:12.6rem; background:#fff; border:2px solid #EFE2DF; border-radius:var(--radius);
  padding:.75rem .7rem .9rem; text-align:center; cursor:pointer; position:relative;
  transition:transform .15s, box-shadow .15s, border-color .15s, opacity .15s;
  box-shadow:0 2px 8px rgba(120,60,50,.06);}
.card:hover{transform:translateY(-3px); box-shadow:0 8px 20px rgba(120,60,50,.14); border-color:var(--red-line)}
#board.focusing .card{opacity:.28}
#board.focusing .card.on{opacity:1; border-color:var(--red); box-shadow:0 8px 22px rgba(200,56,47,.22)}
.card .ava{width:6.4rem; height:6.4rem; object-fit:contain; display:block; margin:0 auto .35rem; cursor:zoom-in}
.card .zhname{font-size:1.38rem; font-weight:800; line-height:1.25; letter-spacing:.05em}
.card .py{font-size:.98rem; color:var(--muted); font-weight:700; margin-top:.05rem}
.card .viname{font-size:1.02rem; font-weight:800; color:var(--red); margin-top:.2rem}
.card[data-scene="abroad"] .viname{color:var(--blue)}
.card .role{display:inline-block; margin-top:.45rem; font-size:.82rem; font-weight:800; line-height:1.55;
  background:var(--red-soft); color:#9c3b34; padding:.26rem .65rem; border-radius:999px;}
.card[data-scene="abroad"] .role{background:#E7F1F8; color:#15587f}
.card.sel{opacity:1!important; border-color:var(--red); box-shadow:0 0 0 4px rgba(200,56,47,.18), 0 8px 22px rgba(200,56,47,.2)}
.card.sel::after{content:attr(data-order); position:absolute; top:-.7rem; left:-.7rem; width:1.7rem; height:1.7rem;
  border-radius:50%; background:var(--red); color:#fff; font-size:.95rem; font-weight:800; display:flex; align-items:center; justify-content:center;
  box-shadow:0 2px 6px rgba(200,56,47,.4)}
#board.pairing .card{opacity:.22}
#board.pairing .card.sel{opacity:1}
#board.pairing #wires > g:not(.pw){opacity:.07}
#wires text.wl2{font-family:'Nunito',sans-serif; font-weight:800; font-size:1.08rem; text-anchor:middle}
#wires text.wl2 tspan.v{font-size:.86rem; font-weight:700; fill:#4a4d53}
.pairbar{position:fixed; left:50%; transform:translateX(-50%); bottom:1.1rem; z-index:50; display:none;
  background:#fff; border:2px solid var(--red-line); border-radius:999px; padding:.5rem .6rem .5rem 1.1rem;
  box-shadow:0 10px 30px rgba(120,60,50,.22); align-items:center; gap:.8rem; max-width:94vw; flex-wrap:wrap}
.pairbar.show{display:flex}
.pairbar .pbn{font-size:1rem; font-weight:800}
.pairbar .pbr{font-size:1rem; font-weight:800; line-height:1.6; color:var(--red); background:var(--red-soft); padding:.32rem .85rem; border-radius:999px}
.pairbar .pbd{font-size:.9rem; color:var(--muted); font-weight:700}
.pairbar button{border:0; background:#F4F1EF; width:2rem;height:2rem; border-radius:50%; cursor:pointer; font-size:1rem; font-weight:900; color:#8a5c57}
.card .movetag{position:absolute; bottom:-.55rem; left:50%; transform:translateX(-50%);
  background:var(--amber); color:#fff; font-size:.7rem; font-weight:800; padding:.1rem .5rem; line-height:1.5;
  border-radius:999px; white-space:nowrap; box-shadow:0 2px 6px rgba(224,123,26,.35)}
.banner{position:relative; z-index:2; background:linear-gradient(90deg,#FFF3E2,#FFFBF5); border:2px solid #F0C98C;
  border-radius:12px; padding:.6rem 1rem; margin-bottom:1rem; display:flex; gap:.8rem; align-items:baseline; flex-wrap:wrap}
.banner b{font-size:1.15rem; font-weight:800; color:#B8650F}
.banner span{font-size:.98rem; font-weight:700; color:#8a6a46}
.card .newdot{position:absolute; top:.45rem; left:.5rem; width:.6rem; height:.6rem; border-radius:50%;
  background:var(--amber); box-shadow:0 0 0 3px rgba(224,123,26,.2)}
#board.onlynew .card{opacity:.2}
#board.onlynew .card.hl{opacity:1}
#board.onlynew #wires > g:not(.new){opacity:.06}
#wires > g.faded{opacity:.5}
#board.focusing #wires > g.faded, #board.pairing #wires > g.faded{opacity:.06}
/* dải tình tiết */
.events{position:relative; z-index:2; display:grid; grid-template-columns:repeat(auto-fit,minmax(17rem,1fr));
  gap:.7rem; margin:0 0 1.4rem}
.ev{background:#fff; border:2px solid #F3DCE4; border-left:5px solid var(--pink); border-radius:12px;
  padding:.6rem .85rem; cursor:pointer; transition:transform .12s, box-shadow .12s}
.ev:hover{transform:translateY(-2px); box-shadow:0 6px 16px rgba(214,51,108,.16)}
.ev b{display:block; font-size:1.02rem; font-weight:800; color:var(--pink); margin-bottom:.1rem}
.ev span{font-size:.9rem; font-weight:700; color:var(--muted)}
.ev.age{border-left-color:var(--amber)} .ev.age b{color:#B8650F}
.evhead{position:relative; z-index:2; font-size:1rem; font-weight:800; color:var(--pink); margin:.2rem 0 .6rem}
/* bảng đối chiếu trong popup */
.tlwrap{padding:1.2rem 1.4rem 1.5rem; overflow-x:auto}
.tl{border-collapse:collapse; width:100%; font-size:.95rem}
.tl th,.tl td{border:1.5px solid #F0E2DF; padding:.5rem .7rem; text-align:center; line-height:1.5}
.tl th{background:var(--red-soft); color:#9c3b34; font-weight:800}
.tl td.lbl2{text-align:left; font-weight:800; background:#FBF6F4; white-space:nowrap}
.tl .hi{color:var(--pink); font-weight:800}
.tl .hi2{color:var(--red); font-weight:800}
.tl small{display:block; font-weight:700; color:var(--muted); font-size:.82rem}
.diff{background:#FFF7EC; border:1.5px dashed #E8C68F; border-radius:10px; padding:.5rem .8rem; margin-bottom:1rem}
.card .tapme{position:absolute; top:.4rem; right:.45rem; font-size:.7rem; font-weight:800; color:#c6c9ce}

/* AI narrator */
.narrator{position:relative; z-index:2; display:flex; align-items:center; gap:.9rem; flex-wrap:wrap;
  background:#fff; border:2px dashed var(--red-line); border-radius:var(--radius); padding:.7rem 1.1rem; margin-bottom:1.4rem;}
.narrator img{width:4.4rem;height:4.4rem;object-fit:contain;cursor:zoom-in}
.narrator .nx b{font-size:1.15rem; font-weight:800}
.narrator .nx{font-size:.95rem; color:var(--muted); font-weight:700}
.narrator .pill{margin-left:auto; font-size:.85rem; font-weight:800; line-height:1.55; background:var(--red-soft); color:#9c3b34; padding:.34rem .8rem; border-radius:999px}

.pending{position:relative; z-index:2; margin-top:1.8rem; background:#FFFBEB; border:2px dashed #E3C878;
  border-radius:var(--radius); padding:.9rem 1.2rem; display:flex; gap:1rem; align-items:center; flex-wrap:wrap;}
.pending img{width:4.6rem;height:4.6rem;object-fit:contain}
.pending .px{max-width:50rem; font-size:.95rem; font-weight:700}
.pending .px b{display:block; font-size:1.05rem; margin-bottom:.15rem; color:#8a6400; font-weight:800}
.empty{position:relative; z-index:2; background:#fff; border:2px dashed var(--red-line); border-radius:var(--radius);
  padding:2.4rem 1.6rem; text-align:center; max-width:46rem; margin:2rem auto;}
.empty h3{margin:.2rem 0 .6rem; font-size:1.35rem; color:var(--red); font-weight:800}
.empty p{margin:.3rem 0; color:var(--muted)}
.empty code{background:var(--red-soft); padding:.1rem .4rem; border-radius:6px; font-size:.9rem; color:#9c3b34}

/* ---------- MODAL ---------- */
.backdrop{position:fixed; inset:0; background:rgba(28,16,14,.55); display:none; z-index:60; padding:1.2rem; overflow:auto}
.backdrop.open{display:flex; align-items:flex-start; justify-content:center}
.modal{background:#fff; border-radius:20px; max-width:44rem; width:100%; margin:auto; overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.3); animation:pop .18s ease-out;}
@keyframes pop{from{transform:scale(.96); opacity:0}to{transform:scale(1); opacity:1}}
.mhead{display:flex; gap:1rem; align-items:center; padding:1.1rem 1.4rem; background:var(--red-soft)}
.mhead.abroad{background:#E7F1F8}
.mhead img{width:7.4rem;height:7.4rem;object-fit:contain}
.mhead .mz{font-size:1.95rem; font-weight:800; letter-spacing:.05em; line-height:1.1}
.mhead .mp{font-size:1.08rem; color:#7a5d59; font-weight:800}
.mhead .mv{font-size:1.22rem; font-weight:800; color:var(--red); margin-top:.1rem}
.mhead.abroad .mv{color:var(--blue)}
.mclose{margin-left:auto; align-self:flex-start; border:0; background:#fff; width:2.2rem;height:2.2rem;
  border-radius:50%; cursor:pointer; font-size:1.1rem; font-weight:900; color:#8a5c57; line-height:1}
.mbody{padding:1.1rem 1.4rem 1.5rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.9rem}
.chip{background:#F4F1EF;border-radius:999px;padding:.3rem .75rem;line-height:1.55;font-size:.9rem;font-weight:800;color:#4a4d53}
.msec{margin-bottom:1rem}
.msec h4{margin:0 0 .3rem; font-size:.84rem; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:800}
.orig{font-size:1.16rem; line-height:1.75; background:#FBF6F4; border-left:4px solid var(--red); padding:.6rem .9rem; border-radius:0 10px 10px 0}
.trans{font-size:1.02rem; line-height:1.6; font-weight:600}
.rels{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.4rem}
.rels li{display:flex; gap:.5rem; align-items:flex-start; font-size:1rem; background:#FBF6F4; border-radius:10px; padding:.42rem .7rem; font-weight:600}
.rels li b{color:var(--red); white-space:nowrap; font-weight:800}
.lvtag{font-size:.85rem;color:var(--muted);font-weight:800}

@media (max-width:1100px){
  .scenes{grid-template-columns:1fr; gap:2rem}
  .china-grid{grid-template-columns:auto auto}
  .china-grid .colleague{grid-column:1 / 3; grid-row:auto}
}

/* ---------- vẽ đường nối (định tuyến vuông góc) ---------- */
function R(sel){
  const el=typeof sel==="string"?document.querySelector(sel):sel; if(!el) return null;
  const b=el.getBoundingClientRect(), r=board.getBoundingClientRect();
  const x=b.left-r.left+board.scrollLeft, y=b.top-r.top+board.scrollTop;
  return {x,y,w:b.width,h:b.height,cx:x+b.width/2,cy:y+b.height/2,r:x+b.width,b:y+b.height};
}
function mk(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
function rpath(pts,rad){
  rad=rad||14;
  const p=[pts[0]]; for(let i=1;i<pts.length;i++){const a=p[p.length-1],b=pts[i]; if(Math.abs(a[0]-b[0])>.5||Math.abs(a[1]-b[1])>.5)p.push(b);}
  if(p.length<2) return "";
  let d=`M${p[0][0]},${p[0][1]}`;
  for(let i=1;i<p.length-1;i++){
    const [x0,y0]=p[i-1],[x1,y1]=p[i],[x2,y2]=p[i+1];
    const d1=Math.hypot(x1-x0,y1-y0), d2=Math.hypot(x2-x1,y2-y1);
    const r=Math.min(rad,d1/2,d2/2);
    const u1=[(x1-x0)/d1,(y1-y0)/d1], u2=[(x2-x1)/d2,(y2-y1)/d2];
    d+=` L${x1-u1[0]*r},${y1-u1[1]*r} Q${x1},${y1} ${x1+u2[0]*r},${y1+u2[1]*r}`;
  }
  d+=` L${p[p.length-1][0]},${p[p.length-1][1]}`;
  return d;
}
function line(g,pts,col,dash){
  g.appendChild(mk("path",{class:"link",d:rpath(pts),stroke:col,"stroke-width":3,
    "stroke-dasharray":dash?"8 7":""}));
}
function tag(g,x,y,zh,vi,col,sub){
  const gg=mk("g",{class:"lbl"});
  const t=mk("text",{class:"wl",x:x,y:y,fill:col});
  const t1=mk("tspan",{x:x,dy:(sub?"-0.75em":(vi?"-0.15em":"0.35em")),class:"zh"}); t1.textContent=zh; t.appendChild(t1);
  if(vi){const t2=mk("tspan",{x:x,dy:"1.2em",class:"v"}); t2.textContent=vi; t.appendChild(t2);}
  if(sub){const t3=mk("tspan",{x:x,dy:"1.2em",class:"v zh"}); t3.textContent=sub; t.appendChild(t3);}
  gg.appendChild(t); g.appendChild(gg);
  const bb=t.getBBox(), px=8, py=5;
  const rect=mk("rect",{class:"pill",x:bb.x-px,y:bb.y-py,width:bb.width+px*2,height:bb.height+py*2,
    rx:9,stroke:col,"stroke-opacity":.35});
  gg.insertBefore(rect,t);
}
function draw(){
  const L=LEVELS[current]; svg.innerHTML="";
  if(!L||!L.ready) return;
  svg.setAttribute("width",board.scrollWidth); svg.setAttribute("height",board.scrollHeight);
  svg.setAttribute("viewBox",`0 0 ${board.scrollWidth} ${board.scrollHeight}`);
  L.wires.forEach(w=>{
    const g=mk("g",{"data-nodes":(w.nodes||[]).join(","),
      class:(w.faded?"faded ":"")+(w.isNew?"new":"")}); const col=w.color||"var(--red)";
    svg.appendChild(g); /* phải gắn vào DOM trước khi đo getBBox cho nhãn */
    if(w.kind==="vLink"){
      const A=R(w.from), B=R(w.to); if(!A||!B) return;
      const top=A.cy<B.cy?A:B, bot=A.cy<B.cy?B:A;
      const my=top.b+(bot.y-top.b)*(w.yFrac||0.5);
      line(g,[[top.cx,top.b],[top.cx,my],[bot.cx,my],[bot.cx,bot.y]],col,w.dash);
      const lx=w.labelX==="start"?top.cx:(w.labelX==="end"?bot.cx:(top.cx+bot.cx)/2);
      tag(g,lx,my,w.zh,w.vi,col,w.sub);
    }
    if(w.kind==="hLink"){
      const A=R(w.from), B=R(w.to); if(!A||!B) return;
      const l=A.cx<B.cx?A:B, r=A.cx<B.cx?B:A, mx=(l.r+r.x)/2;
      const ly=l.cy+((l===A?w.dyFrom:w.dyTo)||0), ry=r.cy+((r===A?w.dyFrom:w.dyTo)||0);
      line(g,[[l.r,ly],[mx,ly],[mx,ry],[r.x,ry]],col,w.dash);
      tag(g,mx,(ly+ry)/2,w.zh,w.vi,col,w.sub);
    }
    if(w.kind==="topLink"){
      const A=R(w.from), B=R(w.to); if(!A||!B) return;
      const ty=Math.min(A.y,B.y)-34;
      line(g,[[A.cx,A.y],[A.cx,ty],[B.cx,ty],[B.cx,B.y]],col,w.dash);
      tag(g,(A.cx+B.cx)/2,ty,w.zh,w.vi,col);
    }
    if(w.kind==="loopLeft"){
      const A=R(w.from), B=R(w.to); if(!A||!B) return;
      const bot=board.scrollHeight-34, lx=12;
      line(g,[[A.cx,A.b],[A.cx,bot],[lx,bot],[lx,B.cy],[B.x,B.cy]],col,w.dash);
      tag(g,(A.cx+lx)/2,bot,w.zh,w.vi,col,w.sub);
    }
    if(w.kind==="family"){
      const p1=R(w.couple[0]), p2=R(w.couple[1]); if(!p1||!p2) return;
      const kids=w.kids.map(R).filter(Boolean);
      const l=p1.cx<p2.cx?p1:p2, r=p1.cx<p2.cx?p2:p1, cy=(p1.cy+p2.cy)/2;
      g.appendChild(mk("path",{class:"link",d:`M${l.r},${cy} L${r.x},${cy}`,stroke:col,"stroke-width":3.5}));
      const jx=(l.r+r.x)/2, pb=Math.max(p1.b,p2.b), kt=Math.min(...kids.map(k=>k.y));
      const bus=(pb+kt)/2;
      const xs=kids.map(k=>k.cx);
      g.appendChild(mk("path",{class:"link",d:`M${jx},${cy} L${jx},${bus}`,stroke:col,"stroke-width":3}));
      g.appendChild(mk("path",{class:"link",d:`M${Math.min(...xs,jx)},${bus} L${Math.max(...xs,jx)},${bus}`,stroke:col,"stroke-width":3}));
      kids.forEach((k,i)=>{
        g.appendChild(mk("path",{class:"link",d:`M${k.cx},${bus} L${k.cx},${k.y}`,stroke:col,"stroke-width":3}));
        const t=w.kidLabels&&w.kidLabels[i]; if(t) tag(g,k.cx,(bus+k.y)/2,t.zh,t.vi,col);
      });
      tag(g,jx,cy,w.zh,w.vi,col);
    }
  });
}

/* ---------- tương tác ---------- */
function openModal(id){
  const c=V(id); if(!c) return; const ab=c.scene==="abroad";
  const d=diffOf(id);
  document.getElementById("modal").innerHTML=`
    <div class="mhead ${ab?"abroad":""}"><img src="${AVATARS[id]}" alt="${c.vi}">
      <div><div class="mz zh">${c.zh}</div><div class="mp">${c.py}</div><div class="mv">${c.vi}</div></div>
      <button class="mclose" id="mclose" aria-label="Đóng">✕</button></div>
    <div class="mbody">
      <div class="chips">${c.chips.map(x=>`<span class="chip">${x}</span>`).join("")}<span class="chip">${c.role}</span></div>
      ${d?`<div class="diff"><b style="color:#B8650F">So với cấp trước:</b><br>${d.map(x=>"• "+x).join("<br>")}</div>`:""}
      <div class="msec"><div class="orig zh">${c.zhDesc}</div></div>
      <div class="msec"><div class="trans">${c.viDesc}</div></div>
      <div class="msec"><h4>Quan hệ với các nhân vật khác</h4>
        <ul class="rels">${c.rels.map(r=>`<li><b>${r[0]}:</b> <span>${r[1]}</span></li>`).join("")}</ul></div>
      <div class="lvtag">Đang xem: ${LEVELS[current].label} · nguyên văn trích từ trang 主要人物</div></div>`;
  document.getElementById("backdrop").classList.add("open");
  document.getElementById("mclose").onclick=closeModal;
}
function closeModal(){document.getElementById("backdrop").classList.remove("open");}
document.getElementById("backdrop").addEventListener("click",e=>{if(e.target.id==="backdrop")closeModal();});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeModal();resetSel();}
  if(e.key==="+"||e.key==="=")zoom(.1);
  if(e.key==="-"||e.key==="_")zoom(-.1);
});
let sel=[];
const pairbar=document.getElementById("pairbar");
stage.addEventListener("click",e=>{
  const img=e.target.closest("[data-open]"); if(img){openModal(img.dataset.open);return;}
  const ev=e.target.closest("[data-ev]");
  if(ev){const E=LEVELS[current].events[+ev.dataset.ev];
    if(E.pair){sel=[E.pair[0],E.pair[1]]; applySel();}
    else if(E.nodes){resetSel(); board.classList.add("focusing");
      stage.querySelectorAll(".card").forEach(c=>c.classList.toggle("on",E.nodes.includes(c.dataset.id)));
      svg.querySelectorAll("g.on").forEach(g=>g.classList.remove("on"));}
    return;}
  const card=e.target.closest(".card");
  if(!card){resetSel();return;}
  const id=card.dataset.id;
  if(sel.includes(id)) sel=sel.filter(x=>x!==id);
  else if(sel.length>=2) sel=[id];
  else sel.push(id);
  applySel();
});
stage.addEventListener("mouseover",e=>{if(sel.length)return;const c=e.target.closest(".card"); if(c)focusNode(c.dataset.id);});
stage.addEventListener("mouseleave",()=>{if(!sel.length)clearFocus();});
function resetSel(){sel=[];applySel();}
function applySel(){
  stage.querySelectorAll(".card").forEach(c=>{c.classList.remove("sel");c.removeAttribute("data-order");});
  sel.forEach((id,i)=>{const el=document.getElementById("card-"+id); if(el){el.classList.add("sel");el.setAttribute("data-order",i+1);}});
  svg.querySelectorAll("g.pw").forEach(g=>g.remove());
  board.classList.remove("pairing");
  if(sel.length===0){clearFocus();pairbar.classList.remove("show");return;}
  if(sel.length===1){
    focusNode(sel[0]);
    pairbar.className="pairbar show";
    pairbar.innerHTML=`<span class="pbn zh">${C[sel[0]].zh}</span><span class="pbd">Chọn thêm một nhân vật để xem quan hệ</span>
      <button id="pbx" title="Bỏ chọn">✕</button>`;
    document.getElementById("pbx").onclick=resetSel; return;
  }
  clearFocus(); board.classList.add("pairing");
  const [a,b]=sel, rel=relOf(a,b);
  drawPair(a,b,rel);
  pairbar.className="pairbar show";
  pairbar.innerHTML=`<span class="pbn"><span class="zh">${C[a].zh}</span> ${C[a].vi} &nbsp;↔&nbsp; <span class="zh">${C[b].zh}</span> ${C[b].vi}</span>
    <span class="pbr"><span class="zh">${rel.zh}</span> · ${rel.vi}</span>
    ${rel.note?`<span class="pbd zh">${rel.note}</span>`:""}
    <button id="pbx" title="Bỏ chọn">✕</button>`;
  document.getElementById("pbx").onclick=resetSel;
}
function drawPair(a,b,rel){
  const ra=R("#card-"+a), rb=R("#card-"+b); if(!ra||!rb) return;
  const g=mk("g",{class:"pw"}); svg.appendChild(g);
  const col=rel.color||"var(--red)";
  let pts,lx,ly;
  if(Math.abs(ra.cx-rb.cx)>=Math.abs(ra.cy-rb.cy)){
    const l=ra.cx<rb.cx?ra:rb, r=ra.cx<rb.cx?rb:ra, mx=(l.r+r.x)/2;
    pts=[[l.r,l.cy],[mx,l.cy],[mx,r.cy],[r.x,r.cy]]; lx=mx; ly=(l.cy+r.cy)/2;
  }else{
    const t=ra.cy<rb.cy?ra:rb, bm=ra.cy<rb.cy?rb:ra, my=(t.b+bm.y)/2;
    pts=[[t.cx,t.b],[t.cx,my],[bm.cx,my],[bm.cx,bm.y]]; lx=(t.cx+bm.cx)/2; ly=my;
  }
  g.appendChild(mk("path",{class:"link",d:rpath(pts),stroke:col,"stroke-width":4.5,
    "stroke-dasharray":rel.dash?"9 8":""}));
  const t=mk("text",{class:"wl2",x:lx,y:ly,fill:col});
  const t1=mk("tspan",{x:lx,dy:"-0.15em",class:"zh"}); t1.textContent=rel.zh; t.appendChild(t1);
  const t2=mk("tspan",{x:lx,dy:"1.25em",class:"v"}); t2.textContent=rel.vi; t.appendChild(t2);
  g.appendChild(t);
  const bb=t.getBBox();
  const rect=mk("rect",{class:"pill",x:bb.x-11,y:bb.y-7,width:bb.width+22,height:bb.height+14,rx:11,
    stroke:col,"stroke-opacity":.55,"stroke-width":2});
  g.insertBefore(rect,t);
}
function focusNode(id){
  const L=LEVELS[current]; if(!L.ready) return;
  const set=new Set([id]);
  L.wires.forEach(w=>{if((w.nodes||[]).includes(id))w.nodes.forEach(n=>set.add(n));});
  board.classList.add("focusing");
  stage.querySelectorAll(".card").forEach(c=>c.classList.toggle("on",set.has(c.dataset.id)));
  svg.querySelectorAll("g[data-nodes]").forEach(g=>g.classList.toggle("on",(g.dataset.nodes||"").split(",").includes(id)));
}
function clearFocus(){
  board.classList.remove("focusing");
  stage.querySelectorAll(".card.on").forEach(c=>c.classList.remove("on"));
  svg.querySelectorAll("g.on").forEach(g=>g.classList.remove("on"));
}
const tabsEl=document.getElementById("tabs");
tabsEl.innerHTML=Object.keys(LEVELS).map(k=>
 `<button class="tab" role="tab" data-k="${k}" data-ready="${LEVELS[k].ready}" aria-selected="${k===current}">${LEVELS[k].label}</button>`).join("");
tabsEl.addEventListener("click",e=>{
  const b=e.target.closest(".tab"); if(!b)return; current=b.dataset.k;
  tabsEl.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.k===current));
  sel=[]; document.getElementById("pairbar").classList.remove("show"); board.classList.remove("pairing");
  LEVELS[current].ready?renderLevel():renderEmpty(current);
  syncNewToggle();
});
const newWrap=document.getElementById("newWrap"), newToggle=document.getElementById("newToggle");
newToggle.onchange=e=>{board.classList.toggle("onlynew",e.target.checked);};
function syncNewToggle(){
  const L=LEVELS[current], on=!!L.newNodes;
  newWrap.style.display=on?"flex":"none";
  if(!on){newToggle.checked=false; board.classList.remove("onlynew");}
  else{board.classList.toggle("onlynew",newToggle.checked);
    stage.querySelectorAll(".card").forEach(c=>c.classList.toggle("hl",L.newNodes.includes(c.dataset.id)));}
}

  document.getElementById("backdrop").classList.add("open");
